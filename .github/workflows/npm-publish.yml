# Trusted publication for @starreview/mcp from its declared public repository.
#
# Security boundary:
#   1. `candidate` has no OIDC permission. It packs the mirror, tests an exact
#      CLI commit, and verifies that consumer code did not mutate the tarball.
#   2. `publish` has id-token:write but never checks out or executes repository
#      or CLI code. It downloads, verifies, and publishes only that exact
#      candidate artifact.
#   3. `verify_registry` has no OIDC permission. After publication it downloads
#      the registry tarball, compares its SHA256 to the candidate, and verifies
#      the exact package contents.

name: npm trusted publish

on:
  workflow_dispatch:
    inputs:
      mirror_sha:
        description: Reviewed full 40-character lowercase commit SHA from Fabsbags/starreview-mcp main
        required: true
        type: string
      cli_sha:
        description: Full 40-character lowercase commit SHA from Fabsbags/starreview-agent
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mirror_sha: ${{ steps.guard.outputs.mirror_sha }}
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      filename: ${{ steps.candidate.outputs.filename }}
      sha256: ${{ steps.candidate.outputs.sha256 }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - name: Guard repository, branch, mirror commit, and CLI commit
        id: guard
        shell: bash
        env:
          MIRROR_SHA: ${{ inputs.mirror_sha }}
          CLI_SHA: ${{ inputs.cli_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "Fabsbags/starreview-mcp" ]]; then
            echo "Refusing publish candidate in $GITHUB_REPOSITORY."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Refusing publish candidate from $GITHUB_REF; dispatch from main."
            exit 1
          fi
          if [[ ! "$MIRROR_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "mirror_sha must be a full 40-character lowercase hexadecimal commit SHA."
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$MIRROR_SHA" ]]; then
            echo "Dispatch commit mismatch: expected $MIRROR_SHA, got $GITHUB_SHA."
            exit 1
          fi
          if [[ ! "$CLI_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "cli_sha must be a full 40-character lowercase hexadecimal commit SHA."
            exit 1
          fi
          echo "mirror_sha=$MIRROR_SHA" >> "$GITHUB_OUTPUT"
          echo "cli_sha=$CLI_SHA" >> "$GITHUB_OUTPUT"

      # Pinned GitHub-owned actions: checkout v4.3.1, setup-node v4.4.0.
      - name: Check out exact public mirror commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ steps.guard.outputs.mirror_sha }}
          persist-credentials: false

      - name: Verify mirror checkout resolved exactly
        shell: bash
        env:
          EXPECTED_MIRROR_SHA: ${{ steps.guard.outputs.mirror_sha }}
        run: |
          set -euo pipefail
          actual_mirror_sha="$(git rev-parse HEAD)"
          if [[ "$actual_mirror_sha" != "$EXPECTED_MIRROR_SHA" ]]; then
            echo "Mirror checkout mismatch: expected $EXPECTED_MIRROR_SHA, got $actual_mirror_sha."
            exit 1
          fi

      - name: Verify trusted-publish workflow guards
        run: node --test tests/trustedPublishWorkflow.test.mjs

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Verify bundled release toolchain
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const [major, minor] = process.versions.node.split('.').map(Number);
            if (major < 22 || (major === 22 && minor < 14)) {
              throw new Error('trusted publish requires Node.js >=22.14');
            }
          "
          node -e "
            const { execFileSync } = require('node:child_process');
            const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
            if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) {
              throw new Error('trusted publish requires npm >=11.5.1');
            }
          "

      - name: Guard package and registry versions
        run: |
          node -e "
            const pkg = require('./package.json');
            const manifest = require('./server.json');
            if (pkg.version !== manifest.version) {
              console.error('version mismatch: package.json ' + pkg.version + ' vs server.json ' + manifest.version);
              process.exit(1);
            }
            if (pkg.repository?.url !== 'git+https://github.com/Fabsbags/starreview-mcp.git') {
              console.error('package repository must identify the trusted-publisher repository');
              process.exit(1);
            }
            console.log('testing @starreview/mcp@' + pkg.version);
          "

      - name: Pack and hash candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/mcp-candidate"
          mkdir -p "$candidate_dir"
          filename="$(npm pack --silent --ignore-scripts --pack-destination "$candidate_dir" | tail -n 1)"
          tarball="$candidate_dir/$filename"
          if [[ ! -f "$tarball" ]]; then
            echo "npm pack did not create $tarball"
            exit 1
          fi
          sha256="$(sha256sum "$tarball" | awk '{print $1}')"
          version="$(node -p "require('./package.json').version")"
          echo "artifact_name=starreview-mcp-$version-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out exact CLI consumer commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: Fabsbags/starreview-agent
          ref: ${{ steps.guard.outputs.cli_sha }}
          path: cli-consumer
          persist-credentials: false

      - name: Verify CLI checkout resolved exactly
        working-directory: cli-consumer
        shell: bash
        env:
          EXPECTED_CLI_SHA: ${{ steps.guard.outputs.cli_sha }}
        run: |
          set -euo pipefail
          actual_cli_sha="$(git rev-parse HEAD)"
          if [[ "$actual_cli_sha" != "$EXPECTED_CLI_SHA" ]]; then
            echo "CLI checkout mismatch: expected $EXPECTED_CLI_SHA, got $actual_cli_sha"
            exit 1
          fi

      - name: Install packed MCP candidate without lifecycle scripts
        working-directory: cli-consumer
        env:
          MCP_CANDIDATE: ${{ steps.candidate.outputs.tarball }}
        run: npm install --no-save --package-lock=false --ignore-scripts "$MCP_CANDIDATE" ajv@8.20.0 ajv-formats@3.0.1

      - name: Guard CLI requests satisfy the candidate contract
        working-directory: cli-consumer
        run: npm run test:contract

      - name: Verify tested candidate is unchanged and write checksum
        shell: bash
        env:
          MCP_CANDIDATE: ${{ steps.candidate.outputs.tarball }}
          MCP_FILENAME: ${{ steps.candidate.outputs.filename }}
          EXPECTED_SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: |
          set -euo pipefail
          actual_sha256="$(sha256sum "$MCP_CANDIDATE" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "Candidate changed during consumer testing."
            exit 1
          fi
          printf '%s  %s\n' "$EXPECTED_SHA256" "$MCP_FILENAME" \
            > "$MCP_CANDIDATE.sha256"

      # upload-artifact v4.6.2
      - name: Upload exact tested candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: |
            ${{ steps.candidate.outputs.tarball }}
            ${{ steps.candidate.outputs.tarball }}.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: candidate
    runs-on: ubuntu-latest
    if: github.repository == 'Fabsbags/starreview-mcp' && github.ref == 'refs/heads/main' && github.sha == needs.candidate.outputs.mirror_sha
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Guard trusted-publisher identity
        shell: bash
        env:
          EXPECTED_MIRROR_SHA: ${{ needs.candidate.outputs.mirror_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "Fabsbags/starreview-mcp" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Refusing trusted publish outside Fabsbags/starreview-mcp main."
            exit 1
          fi
          if [[ ! "$EXPECTED_MIRROR_SHA" =~ ^[0-9a-f]{40}$ || "$GITHUB_SHA" != "$EXPECTED_MIRROR_SHA" ]]; then
            echo "Refusing trusted publish: workflow SHA does not equal reviewed mirror SHA."
            exit 1
          fi

      # download-artifact v4.3.0. No checkout occurs in this OIDC-capable job.
      - name: Download tested candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: candidate

      - name: Verify exact artifact and SHA256
        shell: bash
        env:
          MCP_FILENAME: ${{ needs.candidate.outputs.filename }}
          EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: |
          set -euo pipefail
          tarball="candidate/$MCP_FILENAME"
          checksum="$tarball.sha256"
          if [[ ! -f "$tarball" || ! -f "$checksum" ]]; then
            echo "Candidate artifact is incomplete."
            exit 1
          fi
          file_count="$(find candidate -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "$file_count" != "2" ]]; then
            echo "Candidate artifact must contain exactly the tarball and checksum."
            exit 1
          fi
          expected_line="$EXPECTED_SHA256  $MCP_FILENAME"
          if [[ "$(cat "$checksum")" != "$expected_line" ]]; then
            echo "Checksum manifest does not match candidate job output."
            exit 1
          fi
          (
            cd candidate
            sha256sum --check "$MCP_FILENAME.sha256"
          )

      - name: Set up Node.js 24 for trusted publish
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Guard bundled trusted-publishing toolchain
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const [major, minor] = process.versions.node.split('.').map(Number);
            if (major < 22 || (major === 22 && minor < 14)) {
              throw new Error('trusted publish requires Node.js >=22.14');
            }
          "
          node -e "
            const { execFileSync } = require('node:child_process');
            const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
            if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) {
              throw new Error('trusted publish requires npm >=11.5.1');
            }
          "

      - name: Publish exact verified tarball with provenance
        env:
          MCP_FILENAME: ${{ needs.candidate.outputs.filename }}
        run: npm publish "./candidate/$MCP_FILENAME" --access public --provenance --ignore-scripts

  verify_registry:
    needs:
      - candidate
      - publish
    runs-on: ubuntu-latest
    if: github.repository == 'Fabsbags/starreview-mcp' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Guard registry-verification identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "Fabsbags/starreview-mcp" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Refusing registry verification outside Fabsbags/starreview-mcp main."
            exit 1
          fi

      - name: Set up Node.js 24 for registry verification
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Verify bundled registry toolchain
        shell: bash
        run: |
          set -euo pipefail
          node -e "
            const [major, minor] = process.versions.node.split('.').map(Number);
            if (major < 22 || (major === 22 && minor < 14)) {
              throw new Error('registry verification requires Node.js >=22.14');
            }
          "
          node -e "
            const { execFileSync } = require('node:child_process');
            const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
            if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) {
              throw new Error('registry verification requires npm >=11.5.1');
            }
          "

      - name: Verify registry tarball bytes and contents
        shell: bash
        env:
          MCP_FILENAME: ${{ needs.candidate.outputs.filename }}
          MCP_VERSION: ${{ needs.candidate.outputs.version }}
          EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: |
          set -euo pipefail
          package_spec="@starreview/mcp@$MCP_VERSION"

          published_version=""
          for attempt in {1..12}; do
            published_version="$(npm view "$package_spec" version 2>/dev/null || true)"
            if [[ "$published_version" == "$MCP_VERSION" ]]; then
              break
            fi
            if [[ "$attempt" == "12" ]]; then
              echo "Registry did not expose exact version $MCP_VERSION."
              exit 1
            fi
            sleep 5
          done

          mkdir registry
          registry_filename=""
          for attempt in {1..6}; do
            if registry_filename="$(npm pack "$package_spec" --silent --ignore-scripts --pack-destination registry 2>/dev/null | tail -n 1)" \
              && [[ -n "$registry_filename" ]]; then
              break
            fi
            if [[ "$attempt" == "6" ]]; then
              echo "Registry tarball for $package_spec was not downloadable."
              exit 1
            fi
            sleep 5
          done
          if [[ "$registry_filename" != "$MCP_FILENAME" ]]; then
            echo "Registry tarball name mismatch: expected $MCP_FILENAME, got $registry_filename"
            exit 1
          fi
          registry_tarball="registry/$registry_filename"
          actual_sha256="$(sha256sum "$registry_tarball" | awk '{print $1}')"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo "Registry tarball SHA256 does not match the tested candidate."
            exit 1
          fi

          printf '%s\n' \
            package/LICENSE \
            package/README.md \
            package/SKILL.md \
            package/agent-contract.generated.json \
            package/package.json \
            package/server.json \
            | LC_ALL=C sort > expected-contents.txt
          tar -tzf "$registry_tarball" \
            | sed '/\/$/d' \
            | LC_ALL=C sort -u > actual-contents.txt
          diff --unified expected-contents.txt actual-contents.txt
